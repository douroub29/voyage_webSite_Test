# CI/CD DreamTravel
# - CI : à chaque push et pull request -> qualité du code + tests unitaires, d'intégration, fonctionnels et E2E (navigateur)
# - CD : sur la branche par défaut, si tout est vert -> construction d'un livrable de production téléchargeable
name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  PHP_EXTENSIONS: ctype, iconv, intl, mbstring, pdo_mysql, zip
  # Base MariaDB du service ci-dessous ; Doctrine ajoute le suffixe "_test" en environnement de test.
  DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/dreamtravels?serverVersion=10.4.32-MariaDB&charset=utf8mb4'

jobs:
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validation de composer.json
        run: composer validate --no-check-publish

      - name: Installation des dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntaxe PHP
        run: find src tests migrations -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Lint YAML, Twig et conteneur Symfony
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console lint:container

      - name: Mapping Doctrine
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Audit de sécurité des dépendances (informatif)
        run: composer audit --no-interaction
        continue-on-error: true

  tests:
    name: Tests (unitaires, intégration, fonctionnels)
    runs-on: ubuntu-latest
    needs: qualite
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installation des dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Base de test (migrations + fixtures)
        run: composer test:db

      - name: Tests unitaires
        run: php bin/phpunit --testsuite unit --log-junit var/junit-unit.xml

      - name: Tests d'intégration
        run: php bin/phpunit --testsuite integration --log-junit var/junit-integration.xml

      - name: Tests fonctionnels
        run: php bin/phpunit --testsuite functional --log-junit var/junit-functional.xml

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: var/junit-*.xml
          if-no-files-found: ignore

  e2e:
    name: Tests E2E (navigateur, Docker)
    runs-on: ubuntu-latest
    needs: qualite
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Démarrage de la stack Docker (app, MariaDB, Mailpit)
        run: docker compose up -d --build

      - name: Attente de l'application (migrations + fixtures)
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8088/; then echo "Application prête"; exit 0; fi
            sleep 5
          done
          echo "L'application ne répond pas" >&2
          docker compose logs app
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Installation de Playwright et Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests E2E
        working-directory: e2e
        run: npx playwright test

      - name: Rapport Playwright (captures, vidéos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Logs Docker en cas d'échec
        if: failure()
        run: docker compose logs --no-color

  livrable:
    name: Livrable de production (CD)
    runs-on: ubuntu-latest
    needs: [tests, e2e]
    # Uniquement sur la branche par défaut du dépôt (main ou master)
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Dépendances de production uniquement
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Compilation des assets et préchauffage du cache
        run: |
          php bin/console asset-map:compile
          php bin/console cache:warmup

      - name: Archive du livrable
        run: |
          tar --exclude='./.git' --exclude='./.github' --exclude='./tests' --exclude='./var' \
              --exclude='./.env.local' --exclude='./phpunit.dist.xml' \
              -czf "$RUNNER_TEMP/dreamtravel-${GITHUB_SHA::7}.tar.gz" .
          mv "$RUNNER_TEMP"/dreamtravel-*.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: dreamtravel-${{ github.sha }}
          path: dreamtravel-*.tar.gz
          retention-days: 30

      # Déploiement : à brancher sur votre hébergeur (SSH, FTP, PaaS...) une fois choisi.
      # Les secrets (DATABASE_URL, MAILER_DSN, GEMINI_API_KEY...) se configurent dans
      # GitHub > Settings > Secrets and variables > Actions, jamais dans le dépôt.
