$kind: http-request
url: "{{baseUrl}}/admin"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      pm.test('Menu admin avec Sociétés', () => { pm.expect(pm.response.text()).to.include('sidebar-nav'); pm.expect(pm.response.text()).to.include('Sociétés'); });
    language: text/javascript
order: 3000
