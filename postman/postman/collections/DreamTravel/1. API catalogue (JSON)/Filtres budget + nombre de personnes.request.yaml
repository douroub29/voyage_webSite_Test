$kind: http-request
url: "{{baseUrl}}/api/voyages?budget=1500&personnes=2"
method: GET
queryParams:
  budget: "1500"
  personnes: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      pm.test('Prix ≤ 1500 € et au moins 2 places', () => pm.response.json().voyages.forEach(v => { pm.expect(v.prixParPersonne).to.be.at.most(1500); pm.expect(v.placesRestantes).to.be.at.least(2); }));
    language: text/javascript
order: 3000
