$kind: http-request
url: "{{baseUrl}}/assistant/message"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{assistantCsrf}}"
body:
  type: text
  content: '{"message": "   "}'
scripts:
  - type: afterResponse
    code: pm.test('422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 4000
