$kind: http-request
url: "{{baseUrl}}/mon-compte/voucher"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Redirigé vers Mes réservations', () => { pm.response.to.have.status(302); pm.expect(pm.response.headers.get('Location')).to.include('/mon-compte/reservations'); });
    language: text/javascript
settings:
  followRedirects: false
order: 4000
