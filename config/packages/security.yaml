security:
    password_hashers:
        App\Entity\Utilisateur:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            context: dreamtravel   # session partagée avec le site : une seule connexion pour l'admin
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                username_parameter: email
                password_parameter: password
            logout:
                path: admin_logout
                target: admin_login

        main:
            context: dreamtravel
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
        - { path: ^/admin/connexion,      roles: PUBLIC_ACCESS }
        - { path: ^/admin,                roles: ROLE_ADMIN }
        - { path: ^/verifier-email,       roles: PUBLIC_ACCESS }
        - { path: ^/activation,           roles: PUBLIC_ACCESS }
        - { path: ^/renvoyer-activation,  roles: PUBLIC_ACCESS }
        - { path: ^/mon-compte,           roles: ROLE_CLIENT }
        - { path: ^/reservation,          roles: ROLE_CLIENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
