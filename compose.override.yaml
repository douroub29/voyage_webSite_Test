# DreamTravel - surcharge de développement, chargée automatiquement par "docker compose up"
services:
  app:
    build:
      target: dev
    environment:
      APP_ENV: dev
      LOAD_FIXTURES: "1"
      MAILER_DSN: smtp://mailer:1025
    volumes:
      # Code monté depuis l'hôte : les modifications sont visibles sans reconstruire
      - .:/var/www/html
      # Gardés dans le conteneur (plus rapide sous Windows, pas de conflit avec l'hôte)
      - /var/www/html/vendor
      - /var/www/html/var
      # Bibliothèques JS (importmap), non versionnées : on garde celles de l'image
      - /var/www/html/assets/vendor
      - uploads:/var/www/html/public/uploads
    restart: "no"

  database:
    ports:
      - "${DB_PORT:-3307}:3306"

  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - database
    environment:
      PMA_HOST: database
    ports:
      - "8081:80"
